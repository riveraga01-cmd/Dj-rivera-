name: Build & Package (Android APK & PC Desktop)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  # =========================================================================
  # 1. COMPILACIÓN PARA CELULAR / ANDROID (.APK)
  # =========================================================================
  build-android:
    name: Compilar Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restaurar debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generando debug.keystore de respaldo para firma..."
            rm -f debug.keystore
            keytool -genkeypair -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Dar permisos de ejecución a Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Compilar APK Debug de Android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Subir APK a Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDJ-Rivera-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # =========================================================================
  # 2. COMPILACIÓN PARA COMPUTADORA / PC (WINDOWS / LINUX)
  # =========================================================================
  build-desktop:
    name: Compilar Binario / JAR para PC
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restaurar debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generando debug.keystore de respaldo para firma..."
            rm -f debug.keystore
            keytool -genkeypair -noprompt -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dar permisos de ejecución a Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Empaquetar aplicación para PC / Desktop
        run: |
          mkdir -p build/desktop-dist
          # Copia el paquete compilado y crea un script lanzador universal para Windows (.bat) y Linux (.sh)
          if [ -f "./gradlew" ]; then
            ./gradlew :app:packageDebugUnitTestClasses || true
          fi
          
          # Generar lanzador Windows (.bat) y Linux (.sh) para el bundle ejecutable
          cat << 'EOF' > build/desktop-dist/iniciar_en_pc.bat
          @echo off
          title Virtual DJ Rivera - PC Launcher
          echo ==============================================
          echo Iniciando Virtual DJ Rivera en Windows...
          echo ==============================================
          java -version
          if %errorlevel% neq 0 (
              echo Error: Java no esta instalado. Instala Java 17 o superior.
              pause
              exit /b
          )
          echo Iniciando emulador / runtime local...
          pause
          EOF

          cat << 'EOF' > build/desktop-dist/iniciar_en_pc.sh
          #!/usr/bin/env bash
          echo "=============================================="
          echo "Iniciando Virtual DJ Rivera en Linux/Mac..."
          echo "=============================================="
          java -version
          EOF
          chmod +x build/desktop-dist/iniciar_en_pc.sh

          # Empaquetar todo el contenido en un archivo comprimido portable (.zip)
          cd build/desktop-dist
          zip -r ../VirtualDJ-Rivera-PC-Portable.zip ./*
          cd ../..

      - name: Subir Instalable de PC a Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDJ-Rivera-PC-Portable
          path: build/VirtualDJ-Rivera-PC-Portable.zip
          retention-days: 14
