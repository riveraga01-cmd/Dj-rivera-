  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- AUDIO ENGINE (WEB AUDIO API SINTÉTICO & REAL) ---
    class WebAudioDjEngine {
      constructor() {
        this.ctx = null;
        this.deckA = { playing: false, bpm: 128, osc: null, gain: null, filter: null, timer: 0 };
        this.deckB = { playing: false, bpm: 124, osc: null, gain: null, filter: null, timer: 0 };
        this.micStream = null;
        this.micSource = null;
        this.micGain = null;
        this.micAnalyser = null;
        this.micFilter = null;
        this.micDelay = null;
        this.micFeedback = null;
        this.masterGain = null;
        this.duckingMultiplier = 1.0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.85;
          this.masterGain.connect(this.ctx.destination);

          // Setup Deck A
          this.deckA.gain = this.ctx.createGain();
          this.deckA.filter = this.ctx.createBiquadFilter();
          this.deckA.filter.type = 'lowpass';
          this.deckA.filter.frequency.value = 18000;
          this.deckA.gain.connect(this.deckA.filter);
          this.deckA.filter.connect(this.masterGain);

          // Setup Deck B
          this.deckB.gain = this.ctx.createGain();
          this.deckB.filter = this.ctx.createBiquadFilter();
          this.deckB.filter.type = 'lowpass';
          this.deckB.filter.frequency.value = 18000;
          this.deckB.gain.connect(this.deckB.filter);
          this.deckB.filter.connect(this.masterGain);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playDeckBeat(deckKey, freq, duration = 0.25) {
        if (!this.ctx) this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + duration);

        gain.gain.setValueAtTime(0.7 * this.duckingMultiplier, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(gain);
        const targetDeck = deckKey === 'A' ? this.deckA : this.deckB;
        gain.connect(targetDeck.gain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      playSample(padId) {
        if (!this.ctx) this.init();
        const now = this.ctx.currentTime;
        switch (padId) {
          case 1: { // AIRHORN
            const freqs = [370, 392, 440, 523];
            freqs.forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(f, now + i * 0.04);
              g.gain.setValueAtTime(0.25, now + i * 0.04);
              g.gain.exponentialRampToValueAtTime(0.001, now + 0.5 + i * 0.04);
              osc.connect(g);
              g.connect(this.masterGain);
              osc.start(now + i * 0.04);
              osc.stop(now + 0.6);
            });
            break;
          }
          case 2: { // APLAUSOS (Filtered Noise)
            const bufferSize = this.ctx.sampleRate * 0.6;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.15));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;
            const g = this.ctx.createGain();
            g.gain.value = 0.5;
            noise.connect(filter);
            filter.connect(g);
            g.connect(this.masterGain);
            noise.start();
            break;
          }
          case 3: { // RISAS (FM Synthesis)
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            for (let t = 0; t < 0.6; t += 0.08) {
              osc.frequency.setValueAtTime(350, now + t);
              osc.frequency.setValueAtTime(260, now + t + 0.04);
            }
            g.gain.setValueAtTime(0.3, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.6);
            break;
          }
          case 4: { // SCRATCH
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(900, now + 0.1);
            osc.frequency.linearRampToValueAtTime(150, now + 0.25);
            g.gain.setValueAtTime(0.35, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
          }
          case 5: { // SIRENA
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1100, now + 0.25);
            osc.frequency.linearRampToValueAtTime(600, now + 0.5);
            g.gain.setValueAtTime(0.35, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.7);
            break;
          }
          case 6: { // JINGLE LOCAL
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.value = f;
              g.gain.setValueAtTime(0.2, now + i * 0.1);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
              osc.connect(g);
              g.connect(this.masterGain);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.45);
            });
            break;
          }
          case 7: { // DROP BASS
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(32, now + 0.6);
            g.gain.setValueAtTime(0.5, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.65);
            break;
          }
          case 8: { // LASER FX
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2400, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.22);
            g.gain.setValueAtTime(0.4, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.25);
            break;
          }
          default: { // Standard beep tone for slots 9-12
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 440 + padId * 40;
            g.gain.setValueAtTime(0.3, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(g);
            g.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.35);
            break;
          }
        }
      }

      setDucking(isDucked, level = 0.15) {
        this.duckingMultiplier = isDucked ? level : 1.0;
        if (this.deckA.gain && this.deckB.gain && this.ctx) {
          const now = this.ctx.currentTime;
          this.deckA.gain.gain.linearRampToValueAtTime(0.7 * this.duckingMultiplier, now + 0.1);
          this.deckB.gain.gain.linearRampToValueAtTime(0.7 * this.duckingMultiplier, now + 0.1);
        }
      }

      async startMic(onVuUpdate) {
        this.init();
        try {
          this.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.micSource = this.ctx.createMediaStreamSource(this.micStream);
          this.micGain = this.ctx.createGain();
          this.micGain.gain.value = 0.75;

          this.micAnalyser = this.ctx.createAnalyser();
          this.micAnalyser.fftSize = 64;

          this.micSource.connect(this.micGain);
          this.micGain.connect(this.micAnalyser);
          this.micAnalyser.connect(this.masterGain);

          // VU Meter Loop
          const dataArray = new Uint8Array(this.micAnalyser.frequencyBinCount);
          const updateVu = () => {
            if (this.micStream && this.micStream.active) {
              this.micAnalyser.getByteFrequencyData(dataArray);
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
              const avg = sum / dataArray.length;
              const level = Math.min(1.0, (avg / 128));
              onVuUpdate(level);
              requestAnimationFrame(updateVu);
            } else {
              onVuUpdate(0);
            }
          };
          updateVu();
          return true;
        } catch (err) {
          console.warn("Permiso de micrófono no disponible:", err);
          return false;
        }
      }

      stopMic() {
        if (this.micStream) {
          this.micStream.getTracks().forEach(t => t.stop());
          this.micStream = null;
        }
      }

      setMicEffect(effectName) {
        if (!this.ctx || !this.micGain) return;
        // Simple DSP reconfiguration
        try {
          if (effectName === 'MEGAFONO') {
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1400;
            filter.Q.value = 2.0;
            this.micGain.disconnect();
            this.micGain.connect(filter);
            filter.connect(this.micAnalyser);
          } else {
            this.micGain.disconnect();
            this.micGain.connect(this.micAnalyser);
          }
        } catch (e) {}
      }
    }

    const audioDj = new WebAudioDjEngine();

    // --- COMPONENTE PRINCIPAL: DJ CONSOLE APP ---
    function DjConsoleApp() {
      // Perfiles de Lectores / Voces Naturales
      const lectorProfiles = {
        RADIO_DJ: { name: '🎙️ Locutor Radio DJ (Cálido y Enérgico)', pitch: 1.02, rate: 1.04, preferGender: 'male' },
        COMERCIAL: { name: '👩 Locutora Comercial (Suave y Natural)', pitch: 1.14, rate: 0.98, preferGender: 'female' },
        CLUB_DEEP: { name: '🎧 Voz Profunda Club (Grave e Impacto)', pitch: 0.82, rate: 0.94, preferGender: 'male' },
        FIESTA: { name: '🔥 Animador de Fiesta (Dinámico y Alegre)', pitch: 1.12, rate: 1.14, preferGender: 'male' },
        INSTITUCIONAL: { name: '👔 Institucional Rivera (Pausado y Fino)', pitch: 0.96, rate: 0.92, preferGender: 'female' }
      };

      // 1. ANUNCIOS STATE (CRUD CON MODAL)
      const [adsList, setAdsList] = useState([
        {
          id: 'ad1',
          nombre: 'Cuña Rivera Hotel & Lounge',
          textoLocucion: 'Bienvenidos a Rivera Hotel and Lounge. Disfruta de la mejor música y coctelería de autor.',
          tipoLector: 'INSTITUCIONAL',
          duracionSeg: 15,
          frecuencia: 'Cada 30m',
          activo: true,
          tipo: 'tts'
        },
        {
          id: 'ad2',
          nombre: 'Promo Barra Libre 2x1 Cócteles',
          textoLocucion: 'Atención a todas las mesas: dos por uno en cócteles seleccionados en la barra principal.',
          tipoLector: 'COMERCIAL',
          duracionSeg: 12,
          frecuencia: 'Cada 45m',
          activo: true,
          tipo: 'tts'
        },
        {
          id: 'ad3',
          nombre: 'Aviso Estacionamiento & Guardarropa',
          textoLocucion: 'El servicio de estacionamiento y guardarropa se encuentra a su entera disposición.',
          tipoLector: 'RADIO_DJ',
          duracionSeg: 10,
          frecuencia: 'Cada 60m',
          activo: false,
          tipo: 'tts'
        },
        {
          id: 'ad4',
          nombre: 'Despedida y Cierre Seguro',
          textoLocucion: 'Agradecemos su grata presencia esta noche. Recuerden conducir con precaución. Hasta pronto.',
          tipoLector: 'CLUB_DEEP',
          duracionSeg: 20,
          frecuencia: 'Al Cierre',
          activo: true,
          tipo: 'tts'
        }
      ]);
      const [adsActive, setAdsActive] = useState(true);
      const [adsCountdown, setAdsCountdown] = useState(840);
      const [adsDuckingLevel, setAdsDuckingLevel] = useState(0.15);
      const [isPlayingAd, setIsPlayingAd] = useState(false);
      const [currentPlayingAdName, setCurrentPlayingAdName] = useState('');

      // Modal State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAdId, setEditingAdId] = useState(null);
      const [formNombre, setFormNombre] = useState('');
      const [formTextoLocucion, setFormTextoLocucion] = useState('');
      const [formTipoLector, setFormTipoLector] = useState('RADIO_DJ');
      const [formDuracion, setFormDuracion] = useState(15);
      const [formFrecuencia, setFormFrecuencia] = useState('Cada 30m');
      const [formTipo, setFormTipo] = useState('tts');

      // Hora de cierre
      const [closingTime, setClosingTime] = useState('02:00 AM');
      const [closingFarewell, setClosingFarewell] = useState(true);
      const [closingBlockQr, setClosingBlockQr] = useState(true);

      // 2. CONSOLA DECKS Y MEZCLADOR
      const [masterPlaying, setMasterPlaying] = useState(false);
      const [masterVolume, setMasterVolume] = useState(85);
      const [crossfader, setCrossfader] = useState(50); // 0 (A) .. 100 (B)

      // Deck A
      const [deckAPlaying, setDeckAPlaying] = useState(false);
      const [deckATime, setDeckATime] = useState(24);
      const [deckAFader, setDeckAFader] = useState(90);
      const [deckAEq, setDeckAEq] = useState({ hi: 0, mid: 0, low: 0 });

      // Deck B
      const [deckBPlaying, setDeckBPlaying] = useState(false);
      const [deckBTime, setDeckBTime] = useState(10);
      const [deckBFader, setDeckBFader] = useState(85);
      const [deckBEq, setDeckBEq] = useState({ hi: 0, mid: 0, low: 0 });

      // 3. RACK DE CONTROL INTERMEDIO TABS
      const [activeRackTab, setActiveRackTab] = useState('ANUNCIOS');
      const [rackExpanded, setRackExpanded] = useState(true);

      // 4. MIC FX
      const [micOn, setMicOn] = useState(false);
      const [talkOver, setTalkOver] = useState(false);
      const [micGain, setMicGain] = useState(75);
      const [micVu, setMicVu] = useState(0);
      const [micEffect, setMicEffect] = useState('DIRECTO');
      const [dryWet, setDryWet] = useState(50);

      // 5. TTS STATE
      const [ttsMessage, setTtsMessage] = useState('¡Bienvenidos a Rivera Club! En cabina DJ Rivera encendiendo la noche.');
      const [ttsRate, setTtsRate] = useState(1.0);
      const [ttsPitch, setTtsPitch] = useState(1.0);
      const [ttsSpeaking, setTtsSpeaking] = useState(false);

      // 6. QR PETICIONES STATE
      const [qrAccept, setQrAccept] = useState(true);
      const [qrRequests, setQrRequests] = useState([
        { id: 1, mesa: 'Mesa 4', cancion: 'La Bilirrubina', artista: 'Juan Luis Guerra', hora: '23:10', estado: 'PENDIENTE' },
        { id: 2, mesa: 'Mesa 12', cancion: 'Danza Kuduro', artista: 'Don Omar', hora: '23:14', estado: 'PENDIENTE' }
      ]);
      const [qrModalOpen, setQrModalOpen] = useState(false);

      // 7. SAMPLER PADS
      const [activePadId, setActivePadId] = useState(null);
      const [samplerDucking, setSamplerDucking] = useState(true);

      // 8. AUTOMIX
      const [autoMixActive, setAutoMixActive] = useState(false);
      const [autoMixType, setAutoMixType] = useState('Crossfade');

      // --- EFECTOS DE TIEMPO / LOOPS ---
      // Loop Beat para Deck A
      useEffect(() => {
        let interval = null;
        if (deckAPlaying) {
          interval = setInterval(() => {
            setDeckATime(t => (t + 1) % 180);
            audioDj.playDeckBeat('A', 80);
          }, 500); // 120 bpm pulse
        }
        return () => clearInterval(interval);
      }, [deckAPlaying]);

      // Loop Beat para Deck B
      useEffect(() => {
        let interval = null;
        if (deckBPlaying) {
          interval = setInterval(() => {
            setDeckBTime(t => (t + 1) % 180);
            audioDj.playDeckBeat('B', 95);
          }, 480);
        }
        return () => clearInterval(interval);
      }, [deckBPlaying]);

      // Cuenta regresiva de anuncios automáticos
      useEffect(() => {
        if (!adsActive || isPlayingAd) return;
        const timer = setInterval(() => {
          setAdsCountdown(prev => {
            if (prev <= 1) {
              reproducirAnuncio(adsList[0]);
              return 900;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [adsActive, isPlayingAd, adsList]);

      // --- CRUD DE ANUNCIOS ---
      const handleOpenAddModal = () => {
        setEditingAdId(null);
        setFormNombre('');
        setFormTextoLocucion('');
        setFormTipoLector('RADIO_DJ');
        setFormDuracion(15);
        setFormFrecuencia('Cada 30m');
        setFormTipo('tts');
        setIsModalOpen(true);
      };

      const handleOpenEditModal = (ad) => {
        setEditingAdId(ad.id);
        setFormNombre(ad.nombre);
        setFormTextoLocucion(ad.textoLocucion || '');
        setFormTipoLector(ad.tipoLector || 'RADIO_DJ');
        setFormDuracion(ad.duracionSeg);
        setFormFrecuencia(ad.frecuencia);
        setFormTipo(ad.tipo || 'tts');
        setIsModalOpen(true);
      };

      const handleSaveAd = () => {
        if (!formNombre.trim()) return;
        const textToSave = formTextoLocucion.trim() || formNombre.trim();
        if (editingAdId) {
          // Editar existente
          setAdsList(prev => prev.map(a => a.id === editingAdId ? {
            ...a,
            nombre: formNombre,
            textoLocucion: textToSave,
            tipoLector: formTipoLector,
            duracionSeg: Number(formDuracion),
            frecuencia: formFrecuencia,
            tipo: formTipo
          } : a));
        } else {
          // Agregar nuevo
          const newAd = {
            id: 'ad_' + Date.now(),
            nombre: formNombre,
            textoLocucion: textToSave,
            tipoLector: formTipoLector,
            duracionSeg: Number(formDuracion),
            frecuencia: formFrecuencia,
            activo: true,
            tipo: formTipo
          };
          setAdsList(prev => [...prev, newAd]);
        }
        setIsModalOpen(false);
      };

      const handleDeleteAd = (id) => {
        setAdsList(prev => prev.filter(a => a.id !== id));
      };

      const handleToggleActiveAd = (id) => {
        setAdsList(prev => prev.map(a => a.id === id ? { ...a, activo: !a.activo } : a));
      };

      // Reproducción con Ducking Real (SOLO lee el texto exacto escrito en la caja de texto)
      const reproducirAnuncio = (ad) => {
        if (!ad) return;
        setIsPlayingAd(true);
        setCurrentPlayingAdName(ad.nombre);
        audioDj.setDucking(true, adsDuckingLevel);

        // SOLO se lee el texto exacto escrito en la caja de texto (sin prefijos)
        const textoALeer = (ad.textoLocucion && ad.textoLocucion.trim()) ? ad.textoLocucion.trim() : ad.nombre.trim();

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(textoALeer);

          const profile = lectorProfiles[ad.tipoLector] || lectorProfiles.RADIO_DJ;
          utterance.rate = profile.rate;
          utterance.pitch = profile.pitch;

          // Seleccionar la mejor voz disponible del sistema para eliminar sonido robótico
          try {
            const availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices && availableVoices.length > 0) {
              const spanishVoices = availableVoices.filter(v => v.lang && v.lang.startsWith('es'));
              let selectedVoice = null;
              if (profile.preferGender === 'female') {
                selectedVoice = spanishVoices.find(v => /female|mujer|monica|paulina|helena|sabina|lucia/i.test(v.name)) ||
                                availableVoices.find(v => /female/i.test(v.name) && v.lang.startsWith('es'));
              } else {
                selectedVoice = spanishVoices.find(v => /male|hombre|jorge|alvaro|raul|enrique|carlos/i.test(v.name)) ||
                                availableVoices.find(v => /google español|natural/i.test(v.name));
              }
              utterance.voice = selectedVoice || spanishVoices[0] || availableVoices[0];
            }
          } catch (_) {}

          utterance.onend = () => {
            setIsPlayingAd(false);
            setCurrentPlayingAdName('');
            audioDj.setDucking(false);
          };
          utterance.onerror = () => {
            setIsPlayingAd(false);
            setCurrentPlayingAdName('');
            audioDj.setDucking(false);
          };
          window.speechSynthesis.speak(utterance);
        } else {
          setTimeout(() => {
            setIsPlayingAd(false);
            setCurrentPlayingAdName('');
            audioDj.setDucking(false);
          }, ad.duracionSeg * 1000);
        }
      };

      // --- MICRÓFONO EN VIVO ---
      const handleToggleMic = async () => {
        if (!micOn) {
          const success = await audioDj.startMic((level) => setMicVu(level));
          if (success) setMicOn(true);
        } else {
          audioDj.stopMic();
          setMicOn(false);
          setMicVu(0);
          if (talkOver) {
            setTalkOver(false);
            audioDj.setDucking(false);
          }

      // --- TEXT TO SPEECH (TTS REAL) ---

        window.speechSynthesis.cancel();
        setTtsSpeaking(true);
        audioDj.setDucking(true, adsDuckingLevel);

        const u = new SpeechSynthesisUtterance(ttsMessage);
        u.rate = ttsRate;
        u.pitch = ttsPitch;
        u.onend = () => {
          setTtsSpeaking(false);
          audioDj.setDucking(false);
        };
        u.onerror = () => {
          setTtsSpeaking(false);
          audioDj.setDucking(false);
        };
        window.speechSynthesis.speak(u);

                        onClick={() => setQrModalOpen(true)}
                        className="bg-djcyan text-black px-3 py-1 rounded font-black text-xs"
                      >
                        📱 MOSTRAR QR EN PANTALLA
                      </button>
                      <span className="font-mono text-gray-300 text-[10px]">URL: http://192.168.1.50:8080/pedir</span>
                    </div>
                    <button
                      onClick={() => setQrAccept(!qrAccept)}
                      className={`px-2.5 py-1 rounded font-bold text-xs ${qrAccept ? 'bg-djgreen text-black' : 'bg-djred text-white'}`}
                    >
                      {qrAccept ? 'ACEPTANDO SOLICITUDES' : 'RECEPCIÓN BLOQUEADA'}
                    </button>
                  </div>

                  <div className="bg-djcard p-2 rounded border border-djborder">
                    <span className="font-bold text-djcyan text-xs block mb-2">COLA DE SOLICITUDES EN VIVO</span>
                    <div className="space-y-1 max-h-36 overflow-y-auto scrollbar-thin">
                      {qrRequests.map(r => (
                        <div key={r.id} className="bg-neutral-900 p-2 rounded flex justify-between items-center text-xs">
                          <div>
                            <span className="font-bold text-djcyan mr-2">[{r.mesa}]</span>
                            <span className="text-white font-bold">{r.cancion}</span>
                            <span className="text-gray-400 text-[10px]"> • {r.artista} ({r.hora})</span>
                          </div>
                          <div className="flex gap-1.5">
                            <button
                              onClick={() => {
                                alert(`Tema "${r.cancion}" agregado a la cola de AutoMix.`);
                                setQrRequests(prev => prev.filter(x => x.id !== r.id));
                              }}
                              className="bg-djgreen text-black px-2 py-0.5 rounded font-bold text-[10px]"
                            >
                              APROBAR
                            </button>
                            <button
                              onClick={() => setQrRequests(prev => prev.filter(x => x.id !== r.id))}
                              className="bg-neutral-800 text-djred hover:bg-djred hover:text-white px-2 py-0.5 rounded font-bold text-[10px]"
                            >
                              RECHAZAR
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* --- PANEL 3: MIC FX (WEB AUDIO API REAL) --- */}
              {activeRackTab === 'MIC_FX' && (
                <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                  <div className="md:col-span-5 bg-djcard p-3 rounded-lg border border-djborder space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-djgreen text-xs">ENTRADA DE MICRÓFONO</span>
                      <button
                        onClick={handleToggleMic}
                        className={`px-3 py-1 rounded font-black text-xs ${micOn ? 'bg-djgreen text-black' : 'bg-djred text-white'}`}
                      >
                        {micOn ? '🎙️ MIC ON' : 'MIC OFF'}
                      </button>
                    </div>

                    <button
                      onClick={handleToggleTalkOver}
                      className={`w-full py-1.5 rounded font-black text-xs border ${
                        talkOver ? 'bg-djorange text-black border-djorange' : 'bg-neutral-800 text-white border-gray-700'
                      }`}
                    >
                      {talkOver ? '🎙️ TALK OVER ACTIVO (DUCKING 20%)' : 'ACTIVAR TALK OVER'}
                    </button>

                    <div>
                      <div className="flex justify-between text-[10px] text-gray-300">
                        <span>Ganancia Micrófono:</span>
                        <span className="font-mono text-djcyan">{micGain}%</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="100"
                        value={micGain}
                        onChange={(e) => {
                          setMicGain(Number(e.target.value));
                          if (audioDj.micGain) audioDj.micGain.gain.value = Number(e.target.value) / 100;
                        }}
                        className="w-full h-1"
                      />
                    </div>

                    {/* Vúmetro en tiempo real */}
                    <div>
                      <span className="text-[9px] text-gray-400 block mb-1">NIVEL DE ENTRADA (VÚMETRO LED)</span>
                      <div className="w-full h-3 bg-neutral-900 rounded border border-gray-700 overflow-hidden flex">
                        <div
                          className="h-full bg-gradient-to-r from-djgreen via-djamber to-djred transition-all duration-75"
                          style={{ width: `${Math.round(micVu * 100)}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-7 bg-djcard p-3 rounded-lg border border-djborder space-y-2">
                    <span className="font-bold text-djcyan text-xs block">PROCESADOR DE EFECTOS (DSP)</span>
                    <div className="grid grid-cols-4 gap-2">
                      {['DIRECTO', 'PITCH', 'ROBOT', 'MEGÁFONO', 'ECHO'].map(eff => (
                        <button
                          key={eff}
                          onClick={() => {
                            setMicEffect(eff);
                            audioDj.setMicEffect(eff);
                          }}
                          className={`py-1.5 rounded font-bold text-[10px] border ${
                            micEffect === eff ? 'bg-djcyan text-black border-djcyan' : 'bg-neutral-800 text-gray-300 border-gray-700'
                          }`}
                        >
                          {eff}
                        </button>
                      ))}
                    </div>
                    <div className="mt-2">
                      <div className="flex justify-between text-[10px] text-gray-300">
                        <span>Balance DRY / WET:</span>
                        <span className="font-mono text-djcyan">{dryWet}%</span>
                      </div>
                      <input type="range" min="0" max="100" value={dryWet} onChange={(e) => setDryWet(Number(e.target.value))} className="w-full h-1" />
                    </div>
                  </div>
                </div>
              )}

              {/* --- PANEL 4: TEXT TO SPEECH (TTS REAL) --- */}
              {activeRackTab === 'TTS' && (
                <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                  <div className="md:col-span-7 bg-djcard p-3 rounded-lg border border-djborder flex flex-col justify-between">
                    <div>
                      <span className="font-bold text-djorange text-xs block mb-1">MENSAJE PARA LOCUCIÓN</span>
                      <textarea
                        rows="3"
                        value={ttsMessage}
                        onChange={(e) => setTtsMessage(e.target.value)}
                        className="w-full bg-neutral-900 border border-gray-700 rounded p-2 text-white font-sans text-xs focus:border-djorange outline-none"
                        placeholder="Escribe el anuncio o aviso..."
                      />

                      {/* Plantillas Rápidas */}
                      <div className="flex gap-1.5 mt-2">
                        <button
                          onClick={() => setTtsMessage('¡Un saludo especial a todas las mesas disfrutando en Rivera Hotel! DJ Rivera prendiendo la pista.')}
                          className="flex-1 py-1 bg-neutral-800 text-djcyan hover:bg-neutral-700 rounded text-[9px] font-bold border border-gray-700"
                        >
                          SALUDO MESA
                        </button>
                        <button
                          onClick={() => setTtsMessage('¡Atención! 2x1 en cócteles y tragos premium en la barra principal durante los próximos 20 minutos.')}
                          className="flex-1 py-1 bg-neutral-800 text-djamber hover:bg-neutral-700 rounded text-[9px] font-bold border border-gray-700"
                        >
                          PROMO BEBIDAS
                        </button>
                        <button
                          onClick={() => setTtsMessage('Última ronda de bebidas. En breve iniciamos el cierre del local. Gracias por acompañarnos en DJ Rivera.')}
                          className="flex-1 py-1 bg-neutral-800 text-djred hover:bg-neutral-700 rounded text-[9px] font-bold border border-gray-700"
                        >
                          AVISO CIERRE
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="md:col-span-5 bg-djcard p-3 rounded-lg border border-djborder flex flex-col justify-between">
                    <div className="space-y-2">
                      <div>
                        <div className="flex justify-between text-[10px] text-gray-300">
                          <span>Velocidad de Lectura:</span>
                          <span className="font-mono text-djorange font-bold">{ttsRate}x</span>
                        </div>
                        <input
                          type="range"
                          min="0.5"
                          max="1.8"
                          step="0.1"
                          value={ttsRate}
                          onChange={(e) => setTtsRate(Number(e.target.value))}
                          className="w-full h-1 accent-djorange"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between text-[10px] text-gray-300">
                          <span>Tono de Voz (Pitch):</span>
                          <span className="font-mono text-djorange font-bold">{ttsPitch}x</span>
                        </div>
                        <input
                          type="range"
                          min="0.5"
                          max="1.8"
                          step="0.1"
                          value={ttsPitch}
                          onChange={(e) => setTtsPitch(Number(e.target.value))}
                          className="w-full h-1 accent-djorange"
                        />
                      </div>
                    </div>

                    <div className="flex gap-2 mt-3">
                      <button
                        onClick={handleSpeakLive}
                        disabled={ttsSpeaking}
                        className={`flex-1 py-2 rounded font-black text-xs tracking-wider ${
                          ttsSpeaking ? 'bg-djred text-white animate-pulse' : 'bg-djgreen text-black hover:brightness-110'
                        }`}
                      >
                        {ttsSpeaking ? 'EMITIENDO EN VIVO...' : '📢 EMITIR EN VIVO'}
                      </button>
                      <button
                        onClick={handleSaveTtsToAds}
                        className="py-2 px-3 bg-djamber text-black rounded font-black text-xs hover:brightness-110"
                        title="Guardar como anuncio automático"
                      >
                        💾 A ANUNCIOS
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- PANEL 5: AUTOMIX --- */}
              {activeRackTab === 'AUTOMIX' && (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-djcard p-3 rounded border border-djborder space-y-2">
                    <span className="font-bold text-djcyan text-xs block">MOTOR DE MEZCLA AUTOMÁTICA</span>
                    <button
                      onClick={() => setAutoMixActive(!autoMixActive)}
                      className={`w-full py-2 rounded font-black text-xs ${autoMixActive ? 'bg-djred text-white' : 'bg-djgreen text-black'}`}
                    >
                      {autoMixActive ? 'DETENER AUTOMIX' : 'INICIAR AUTOMIX'}
                    </button>
                  </div>
                  <div className="bg-djcard p-3 rounded border border-djborder space-y-1">
                    <span className="font-bold text-djcyan text-xs block">TIPO DE TRANSICIÓN</span>
                    {['Crossfade', 'Beatmatch Sync', 'FadeOut/FadeIn', 'Corte Directo'].map(t => (
                      <button
                        key={t}
                        onClick={() => setAutoMixType(t)}
                        className={`w-full py-1 text-left px-2 rounded text-[10px] font-bold ${autoMixType === t ? 'bg-djcyan text-black' : 'bg-neutral-800 text-gray-300'}`}
                      >
                        • {t}
                      </button>
                    ))}
                  </div>
                  <div className="bg-djcard p-3 rounded border border-djborder flex flex-col justify-between">
                    <div>
                      <span className="font-bold text-djcyan text-xs block mb-1">PRÓXIMA CANCIÓN</span>
                      <p className="font-bold text-white text-xs">Bachata del Sol</p>
                      <p className="text-[10px] text-gray-400">Los Románticos • 130 BPM</p>
                    </div>
                    <button
                      onClick={() => {
                        setCrossfader(crossfader < 50 ? 100 : 0);
                        audioDj.playSample(4); // Scratch
                      }}
                      className="w-full py-1.5 bg-djorange text-black rounded font-black text-xs"
                    >
                      SALTAR CANCIÓN (MEZCLAR YA)
                    </button>
                  </div>
                </div>
              )}

              {/* --- PANEL 6: SAMPLER DE 12 PADS ILUMINADOS CON AUDIO REAL --- */}
              {activeRackTab === 'SAMPLER' && (
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-bold text-djred text-xs">12 PADS DE RENDIMIENTO ILUMINADOS (WEB AUDIO REAL)</span>
                    <label className="flex items-center gap-1.5 text-[10px] cursor-pointer text-gray-300 font-bold">
                      <input
                        type="checkbox"
                        checked={samplerDucking}
                        onChange={(e) => setSamplerDucking(e.target.checked)}
                      />
                      Ducking Automático al Disparar
                    </label>
                  </div>

                  <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                    {[
                      { id: 1, name: 'AIRHORN', color: 'border-djcyan text-djcyan' },
                      { id: 2, name: 'APLAUSOS', color: 'border-djgreen text-djgreen' },
                      { id: 3, name: 'RISAS', color: 'border-djamber text-djamber' },
                      { id: 4, name: 'SCRATCH', color: 'border-djorange text-djorange' },
                      { id: 5, name: 'SIRENA', color: 'border-djred text-djred' },
                      { id: 6, name: 'JINGLE', color: 'border-purple-400 text-purple-400' },
                      { id: 7, name: 'DROP BASS', color: 'border-djcyan text-djcyan' },
                      { id: 8, name: 'LASER FX', color: 'border-djgreen text-djgreen' },
                      { id: 9, name: 'VOCODER', color: 'border-djorange text-djorange' },
                      { id: 10, name: 'SLOT 10', color: 'border-gray-500 text-gray-300' },
                      { id: 11, name: 'SLOT 11', color: 'border-gray-500 text-gray-300' },
                      { id: 12, name: 'SLOT 12', color: 'border-gray-500 text-gray-300' }
                    ].map(pad => (
                      <button
                        key={pad.id}
                        onClick={() => handleTriggerPad(pad.id)}
                        className={`h-14 rounded-lg border-2 flex flex-col items-center justify-center font-black text-[10px] tracking-wider transition-all duration-75 active:scale-95 ${
                          pad.color
                        } ${
                          activePadId === pad.id
                            ? 'bg-white text-black shadow-lg scale-95'
                            : 'bg-neutral-900/90 hover:bg-neutral-800'
                        }`}
                      >
                        <span className="text-[12px]">{pad.id <= 6 ? '⚡' : '🎵'}</span>
                        <span>{pad.name}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ========================================================= */}
          {/* 5. EXPLORADOR / BIBLIOTECA MUSICAL */}
          {/* ========================================================= */}
          <div className="bg-djpanel border border-djborder rounded-lg p-2.5">
            <span className="font-bold text-djcyan text-xs block mb-1.5">BIBLIOTECA MUSICAL DISPONIBLE</span>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              {[
                { title: 'Cumbia Rivera', artist: 'Orquesta Rivera', bpm: 128 },
                { title: 'Noche de Fuego', artist: 'Sabor Latino ft. DJ Rivera', bpm: 124 },
                { title: 'Bachata del Sol', artist: 'Los Románticos', bpm: 130 }
              ].map((song, idx) => (
                <div key={idx} className="bg-djcard p-2 rounded border border-gray-800 flex justify-between items-center">
                  <div>
                    <p className="font-bold text-white text-xs truncate">{song.title}</p>
                    <p className="text-[10px] text-gray-400">{song.artist} • {song.bpm} BPM</p>
                  </div>
                  <div className="flex gap-1">
                    <button
                      onClick={() => { setDeckATime(0); setDeckAPlaying(true); }}
                      className="bg-djcyan/20 border border-djcyan text-djcyan px-1.5 py-0.5 rounded text-[9px] font-bold"
                    >
                      A PLATO A
                    </button>
                    <button
                      onClick={() => { setDeckBTime(0); setDeckBPlaying(true); }}
                      className="bg-djorange/20 border border-djorange text-djorange px-1.5 py-0.5 rounded text-[9px] font-bold"
                    >
                      A PLATO B
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* ========================================================= */}
          {/* MODAL CRUD: AGREGAR / EDITAR ANUNCIO */}
          {/* ========================================================= */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-djpanel border-2 border-djcyan rounded-xl p-4 w-full max-w-md shadow-2xl space-y-3">
                <div className="flex justify-between items-center border-b border-gray-700 pb-2">
                  <h3 className="text-sm font-black text-djcyan tracking-wide">
                    {editingAdId ? '✏️ EDITAR ANUNCIO PUBLICITARIO' : '+ AGREGAR NUEVO ANUNCIO'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white font-bold text-sm">✕</button>
                </div>

                <div className="space-y-2.5">
                  <div>
                    <label className="text-[10px] font-bold text-gray-300 block mb-1">Título / Nombre del Anuncio:</label>
                    <input
                      type="text"
                      value={formNombre}
                      onChange={(e) => setFormNombre(e.target.value)}
                      placeholder="Ej. Promo Tragos 2x1 en Barra"
                      className="w-full bg-neutral-900 border border-gray-700 rounded p-1.5 text-xs text-white outline-none focus:border-djcyan font-sans"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-djamber block mb-1">Texto Exacto para el Locutor (Sin Prefijos):</label>
                    <textarea
                      rows="2"
                      value={formTextoLocucion}
                      onChange={(e) => setFormTextoLocucion(e.target.value)}
                      placeholder="Escribe el texto exacto que el locutor pronunciará. Solo se leerá lo escrito aquí..."
                      className="w-full bg-neutral-900 border border-djamber/60 rounded p-1.5 text-xs text-white outline-none focus:border-djamber font-sans"
                    />
                    <p className="text-[9px] text-gray-400 mt-0.5">El lector pronunciará exclusivamente el texto que escribas en esta caja.</p>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-djcyan block mb-1">Tipo de Lector / Perfil de Voz (Cero Robótico):</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                      {Object.entries(lectorProfiles).map(([key, profile]) => (
                        <button
                          key={key}
                          type="button"
                          onClick={() => setFormTipoLector(key)}
                          className={`p-1.5 rounded text-left text-[10px] font-bold border transition ${
                            formTipoLector === key
                              ? 'bg-djcyan/20 border-djcyan text-white shadow'
                              : 'bg-neutral-900 border-gray-700 text-gray-400 hover:text-white'
                          }`}
                        >
                          {profile.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold text-gray-300 block mb-1">Duración (Segundos):</label>
                      <input
                        type="number"
                        min="5"
                        max="60"
                        value={formDuracion}
                        onChange={(e) => setFormDuracion(e.target.value)}
                        className="w-full bg-neutral-900 border border-gray-700 rounded p-1.5 text-xs text-white outline-none focus:border-djcyan font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-gray-300 block mb-1">Frecuencia / Intervalo:</label>
                      <select
                        value={formFrecuencia}
                        onChange={(e) => setFormFrecuencia(e.target.value)}
                        className="w-full bg-neutral-900 border border-gray-700 rounded p-1.5 text-xs text-white outline-none focus:border-djcyan font-sans"
                      >
                        <option value="Cada 15m">Cada 15m</option>
                        <option value="Cada 30m">Cada 30m</option>
                        <option value="Cada 45m">Cada 45m</option>
                        <option value="Cada 60m">Cada 60m</option>
                        <option value="Al Cierre">Al Cierre</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-gray-300 block mb-1">Tipo de Reproducción:</label>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setFormTipo('tts')}
                        className={`flex-1 py-1.5 rounded text-[10px] font-bold border ${formTipo === 'tts' ? 'bg-djcyan text-black border-djcyan' : 'bg-neutral-900 text-gray-300 border-gray-700'}`}
                      >
                        🎙️ Sintetizador TTS
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormTipo('audio')}
                        className={`flex-1 py-1.5 rounded text-[10px] font-bold border ${formTipo === 'audio' ? 'bg-djamber text-black border-djamber' : 'bg-neutral-900 text-gray-300 border-gray-700'}`}
                      >
                        🎵 Audio Local (.mp3/.wav)
                      </button>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-gray-700">
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="px-3 py-1.5 rounded text-xs font-bold text-gray-400 hover:text-white bg-neutral-800"
                  >
                    CANCELAR
                  </button>
                  <button
                    onClick={handleSaveAd}
                    className="px-4 py-1.5 rounded text-xs font-black text-black bg-djgreen hover:brightness-110 shadow"
                  >
                    GUARDAR ANUNCIO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL QR CODE INTERACTIVO */}
          {/* ========================================================= */}
          {qrModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-djpanel border-2 border-djcyan rounded-xl p-4 w-full max-w-sm text-center space-y-3">
                <h3 className="text-sm font-black text-djcyan">ESCANEA PARA PEDIR CANCIONES</h3>
                <div className="bg-white p-4 rounded-lg inline-block my-2">
                  <svg className="w-40 h-40 text-black" viewBox="0 0 100 100" fill="currentColor">
                    <path d="M0 0h30v30H0zM10 10h10v10H10zM70 0h30v30H70zM80 10h10v10H80zM0 70h30v30H0zM10 80h10v10H10zM40 10h10v10H40zM50 20h10v10H50zM10 40h10v10H10zM30 40h10v10H30zM40 50h10v10H40zM50 60h10v10H50zM60 40h20v10H60zM70 60h20v10H70zM40 80h10v10H40zM60 80h30v20H60z"/>
                  </svg>
                </div>
                <p className="font-mono text-xs text-djcyan">http://192.168.1.50:8080/pedir</p>
                <p className="text-[10px] text-gray-400">Los clientes pueden pedir canciones desde su mesa.</p>
                <button
                  onClick={() => setQrModalOpen(false)}
                  className="w-full py-1.5 bg-neutral-800 text-white font-bold rounded text-xs"
                >
                  CERRAR
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<DjConsoleApp />, document.getElementById('root'));
  </script>
</body>
</html>
